# One-command live preview for the Virtual Prompt Wars submission.
# Render.com (free tier): create a Web Service from this repo; it auto-detects this file.
services:
  - type: web
    name: saans
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt --no-cache-dir
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GEMINI_API_KEY
        sync: false   # optional; app is fully functional without it
